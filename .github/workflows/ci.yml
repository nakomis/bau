name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  web:
    name: Web dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # Version pinned via web/package.json "packageManager"; must precede setup-node.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format check (Biome)
        run: pnpm lint
      - name: Unit and component tests with coverage
        run: pnpm test
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
  # The release version. On main it comes from the deployment tracker (bumped by
  # the merged PR's keyword); on a PR or a manual run it is a throwaway PEP 440
  # dev version, and nothing is published.
  version:
    name: Release version
    needs: [python, web]
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # compute-version
      contents: read
      pull-requests: read  # the merged PR's body, for the bump keyword
    outputs:
      version: ${{ steps.free.outputs.version || steps.dev.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - id: dev
        if: github.event_name != 'push'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=0.0.0.dev${PR_NUMBER:-$RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      # A merge commit carries the PR title but not its body, and the bump
      # keyword normally lives in the body. Read both from the PR itself.
      - name: Merged PR text, for the bump keyword
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo 'COMMIT_MESSAGE<<BAU_EOF'
            git log -1 --pretty=%B
            gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0] | (.title // "") + "\n" + (.body // "")' || true
            echo 'BAU_EOF'
          } >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: eu-west-2
      - id: compute
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: nakomis/nakomis-infra/.github/actions/compute-version@main
        with:
          project: bau
          environment: sandbox
          version-file: version.json
      # Never reuse a tag: a release published by a run that then failed
      # before recording it would otherwise be computed again.
      - name: Skip versions already released
        id: free
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          [ -n "$VERSION" ] || { echo "::error::compute-version returned no version"; exit 1; }
          v=$VERSION
          while gh release view "bau-v$v" > /dev/null 2>&1; do
            IFS=. read -r a b c <<< "$v"; v="$a.$b.$((c + 1))"
          done
          [ "$v" = "$VERSION" ] || echo "::notice::bau-v$VERSION already exists; using $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The two agent images, arm64 only (Cere is an M-series Mac). Built on every
  # run; pushed to Nexus only from main.
  images:
    name: Image ${{ matrix.name }}
    needs: [version]
    runs-on: ubuntu-24.04-arm
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bau-agent
            dockerfile: container/Dockerfile
          - name: bau-egress
            dockerfile: container/egress.Dockerfile
    env:
      REGISTRY: registry.home.nakomis.com
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      TAG: ${{ needs.version.outputs.version }}-${{ needs.version.outputs.sha }}
      IMAGE_NAME: ${{ matrix.name }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # Fail before building anything if a secret is missing: an unset secret
      # expands to an empty string, which would otherwise surface as a
      # baffling TLS or login error halfway through.
      - name: Check the publishing secrets are set
        if: env.PUBLISH == 'true'
        env:
          NEXUS_DOCKER_USER: ${{ secrets.NEXUS_DOCKER_USER }}
          NEXUS_DOCKER_PASSWORD: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
          NEXUS_CLIENT_CERT: ${{ secrets.NEXUS_CLIENT_CERT }}
          NEXUS_CLIENT_KEY: ${{ secrets.NEXUS_CLIENT_KEY }}
        run: |
          missing=0
          for s in NEXUS_DOCKER_USER NEXUS_DOCKER_PASSWORD NEXUS_CLIENT_CERT NEXUS_CLIENT_KEY; do
            if [ -z "${!s}" ]; then
              echo "::error::secret $s is not set"
              missing=1
            fi
          done
          exit "$missing"
      - name: Present the home client cert to the registry
        if: env.PUBLISH == 'true'
        env:
          NEXUS_CLIENT_CERT: ${{ secrets.NEXUS_CLIENT_CERT }}
          NEXUS_CLIENT_KEY: ${{ secrets.NEXUS_CLIENT_KEY }}
        run: |
          d=/etc/docker/certs.d/$REGISTRY
          sudo install -d -m 0755 "$d"
          printf '%s\n' "$NEXUS_CLIENT_CERT" | sudo tee "$d/client.cert" > /dev/null
          printf '%s\n' "$NEXUS_CLIENT_KEY" | sudo install -m 0600 /dev/stdin "$d/client.key"
      - name: Log in to Nexus
        if: env.PUBLISH == 'true'
        env:
          NEXUS_DOCKER_USER: ${{ secrets.NEXUS_DOCKER_USER }}
          NEXUS_DOCKER_PASSWORD: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
        run: printf '%s' "$NEXUS_DOCKER_PASSWORD" | docker login "$REGISTRY" -u "$NEXUS_DOCKER_USER" --password-stdin
      # A tag is never reused (the repository is ALLOW_ONCE): a re-run of a run
      # that already pushed this tag leaves it alone.
      - name: Check whether the image is already published
        id: exists
        if: env.PUBLISH == 'true'
        run: |
          if docker manifest inspect "$REGISTRY/nakomis/$IMAGE_NAME:$TAG" > /dev/null 2>&1; then
            echo "::notice::$IMAGE_NAME:$TAG already exists; not pushing"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # --provenance/--sbom=false: newer Docker attaches an attestation manifest
      # even to a plain build, and Nexus does not take those. A plain schema2
      # manifest only.
      - name: Build
        if: env.PUBLISH != 'true'
        run: |
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
            -f "$DOCKERFILE" -t "bau-ci/$IMAGE_NAME:$TAG" container
      - name: Build and push
        if: env.PUBLISH == 'true' && steps.exists.outputs.exists != 'true'
        run: |
          ref=$REGISTRY/nakomis/$IMAGE_NAME:$TAG
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false \
            -f "$DOCKERFILE" -t "$ref" container --push
          echo "Published \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of Nexus
        if: always() && env.PUBLISH == 'true'
        run: docker logout "$REGISTRY" || true

  # The release bundle: built and smoke-tested on every run, published only
  # from main.
  release:
    name: Release bundle
    needs: [version, images, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # gh release create
      id-token: write        # record-deployment
      pull-requests: read
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Build the bundle
        id: bundle
        run: |
          tarball=$(scripts/build-bundle.sh "$VERSION" "$SHA" "$RUNNER_TEMP/out")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: bundle-smoke
        env:
          TARBALL: ${{ steps.bundle.outputs.tarball }}
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/bau-$VERSION"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            bash -euo pipefail -c "$line"
          done < INSTALL
          out=$(venv/bin/bau version)
          echo "$out"
          [ "$out" = "bau $VERSION ($SHA)" ] || { echo "::error::expected 'bau $VERSION ($SHA)'"; exit 1; }
      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.bundle.outputs.tarball }}
        run: |
          {
            echo "Install (from the extracted bundle):"
            echo
            echo '```'
            tar -xzOf "$TARBALL" "bau-$VERSION/INSTALL"
            echo '```'
            echo
            echo "Images:"
            echo
            echo "- \`registry.home.nakomis.com/nakomis/bau-agent:$VERSION-$SHA\`"
            echo "- \`registry.home.nakomis.com/nakomis/bau-egress:$VERSION-$SHA\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "bau-v$VERSION" "$TARBALL" \
            --target "$GITHUB_SHA" --title "BAU $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: version.json
        if: env.PUBLISH == 'true'
        run: |
          printf '{\n  "version": "%s"\n}\n' "$VERSION" > version.json
      - uses: aws-actions/configure-aws-credentials@v6
        if: env.PUBLISH == 'true'
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          aws-region: eu-west-2
      - uses: nakomis/nakomis-infra/.github/actions/record-deployment@main
        if: env.PUBLISH == 'true'
        with:
          project: bau
          environment: sandbox
          version-file: version.json

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [python, web, version, images, release]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            (.python.result == "success") and (.web.result == "success")
            and ([.version.result, .images.result, .release.result] | all(. == "success" or . == "skipped"))'
