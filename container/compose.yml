name: bau
networks:
  # internal: no route out. Agent containers join this network only and reach the world via bau-egress.
  bau-net:
    internal: true
    name: bau-net  # must match container.network in config/bau.yaml (not prefixed with the project name)
  egress: {}
services:
  bau-egress:
    image: vimagick/tinyproxy@sha256:72b441b95ee1e641af948f68f09492f9f795ead72b73954414e339168c98ad8c
    container_name: bau-egress
    restart: unless-stopped
    networks: [bau-net, egress]
    volumes:
      - ./tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./filter:/etc/tinyproxy/filter:ro
