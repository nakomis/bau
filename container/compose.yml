name: bau
networks:
  # internal: no route out. Agent containers join this network only and reach the world via bau-egress.
  bau-net:
    internal: true
    name: bau-net  # must match container.network in bau/defaults.yaml (not prefixed with the project name)
  egress: {}
services:
  bau-egress:
    image: ${BAU_EGRESS_IMAGE:?set BAU_EGRESS_IMAGE (the release's VERSION file)}
    container_name: bau-egress
    restart: unless-stopped
    networks: [bau-net, egress]
