[project]
name = "bau"
version = "0.1.0"
description = "Overnight BAU maintenance worker: Plane items in, pull requests out"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "PyJWT[crypto]>=2.9", "PyYAML>=6", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
bau = "bau.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bau"]

[tool.pytest.ini_options]
addopts = "--cov=bau --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
