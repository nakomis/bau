# Plane project identifier -> GitHub repo. A ticket may override with a
# `repo: nakomis/<name>` line in its description.
projects:
  BAU:   {repo: nakomis/bau,          deploys: false, deploy_action: ""}
  HOME:  {repo: nakomis/home-infra,   deploys: true,  deploy_action: "Run the relevant playbook: scripts/{leia,luke,mace,cere,mac}-ansible.sh"}
  # Every Plane project with a code repo. deploys: true where any workflow deploys to
  # production on merge/push or by a manual promote (workflow contents read with gh,
  # 18 Oct 2026). cthulhu is deployed by Ansible and epio's docs.yml only publishes
  # GitHub Pages docs, so both stay false.
  ADMIN: {repo: nakomis/nakom-admin,             deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  BAPP:  {repo: nakomis/blog-app,                deploys: true,  deploy_action: "Run the CI workflow on main with promote to production ticked"}
  BOOT:  {repo: nakomis/bootboots,               deploys: false, deploy_action: ""}
  CHATS: {repo: nakomis/claude-chats,            deploys: true,  deploy_action: "The esp32-embedder firmware-prod job publishes firmware to prod on merge to main; check it in GitHub Actions"}
  CLOUD: {repo: nakomis/nakomis-infra,           deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  CRYPT: {repo: nakomis/tinycrypt,               deploys: true,  deploy_action: "Firmware publishes to prod on merge to main; the watch app goes to TestFlight, so promote it in App Store Connect"}
  CSSC:  {repo: nakomis/cdk-ssm-secret-checker,  deploys: false, deploy_action: ""}
  CTHU:  {repo: nakomis/cthulhu,                 deploys: false, deploy_action: ""}
  EYE:   {repo: nakomis/mcps,                    deploys: false, deploy_action: ""}
  FLEET: {repo: nakomis/nakomis-fleet,           deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  HAND:  {repo: nakomis/handmade-intelligence,   deploys: false, deploy_action: ""}
  KAPPA: {repo: nakomis/kappa-warmer,            deploys: false, deploy_action: ""}
  KBRD:  {repo: nakomis/mechanical-keyboard,     deploys: false, deploy_action: ""}
  LAPC:  {repo: nakomis/lapcat,                  deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  LIGHT: {repo: nakomis/lightning,               deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  MUSH:  {repo: nakomis/mushroom-humidor,        deploys: false, deploy_action: ""}
  NAKIS: {repo: nakomis/nakom.is,                deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  NAKTV: {repo: nakomis/naktv,                   deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  NDFM:  {repo: nakomis/nakomis-dragonfruit-mcp, deploys: false, deploy_action: ""}
  PIOE:  {repo: nakomis/epio,                    deploys: false, deploy_action: ""}
  PIPE:  {repo: nakomis/blog-pipeline,           deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  PISH:  {repo: nakomis/pish,                    deploys: false, deploy_action: ""}
  PLAY:  {repo: nakomis/playlist,                deploys: false, deploy_action: ""}
  RECIP: {repo: nakomis/recipator,               deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  SCHIM: {repo: nakomis/schimmelpfennig,         deploys: false, deploy_action: ""}
  SCOPE: {repo: nakomis/nakoscope,               deploys: false, deploy_action: ""}
  SCRUM: {repo: nakomis/nakomis-scrum,           deploys: true,  deploy_action: "Run the promote-prod workflow in GitHub Actions"}
  SINT:  {repo: nakomis/sinter,                  deploys: false, deploy_action: ""}
  STAT:  {repo: nakomis/nakostat,                deploys: true,  deploy_action: "Approve the prod deploy in GitHub Actions"}
  TVRM:  {repo: nakomis/tv-remote,               deploys: false, deploy_action: ""}
  # Not tied to one repo: tickets must name theirs with a `repo:` line.
  PROJ:  {repo: null, deploys: false, deploy_action: ""}
  MULTI: {repo: null, deploys: false, deploy_action: ""}
