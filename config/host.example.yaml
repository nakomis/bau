# Copy to $BAU_HOME/config/host.yaml (Ansible renders it). Everything here is an optional
# override of bau/defaults.yaml; any top-level key must exist in the defaults.
# ${BAU_HOME} and ~ are expanded in paths.*.
#
# Purr needs no client certificate. The API key (actor `bau`) is read from the login keychain,
# service `purr`, account `bau-api-key`. Load it from SSM on a machine with AWS access:
#   security add-generic-password -U -s purr -a bau-api-key \
#     -w "$(aws ssm get-parameter --name /purr/prod/api-keys/bau --with-decryption \
#           --query Parameter.Value --output text)"
# Only set `purr:` here to point at another Purr (say the sandbox):
#
# purr:
#   url: https://purr.sandbox.nakomis.com
#   api_key: {service: purr, account: bau-api-key}
#
# paths:
#   repos: ${BAU_HOME}/repos
#   work: ${BAU_HOME}/work
#   logs: ~/Library/Logs/BAU
#   snapshot: ${BAU_HOME}/state/state.json
#   pause_file: ${BAU_HOME}/state/paused
#   board_cache: ${BAU_HOME}/state/board-cache.json
#   lock: ${BAU_HOME}/state/run.lock
#
# container:
#   image: bau-agent:dev   # normally derived from the build stamp
