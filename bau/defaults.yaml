# Policy lives here, not in code: limits, schedule, models and identities.
# Secrets are never in this file; they come from the macOS keychain, service `bau`.
# To pause the worker, `touch` the file named by paths.pause_file; its contents are the reason.
# Host-specific values go in host.yaml under the config directory (see config/host.example.yaml).

schedule:
  no_new_sessions_after: "05:00"
  timezone: Europe/London

limits:
  pace_margin: 0.10
  five_hour_kill: 0.80
  session_wall_clock_minutes: 60
  session_budget_usd: 5.0
  fail_closed_sessions: 2
  ci_fix_sessions_per_pr: 3
  too_big_files: 15
  too_big_lines: 400
  sweep_session_wall_clock_minutes: 15
  triage_budget_usd: 1.25
  triage_wall_clock_minutes: 10
  max_question_rounds: 4
  sweep_owner_quiet_days: 7
  sweep_batch_items: 40
  max_triage_failures: 2

# Dashboard nudges (BD-1): warn at the count or the age, down at the higher pair.
nudge:
  prs_warn_count: 5
  prs_warn_days: 5
  prs_down_count: 10
  prs_down_days: 14
  questions_warn_count: 5
  questions_warn_days: 3
  questions_down_count: 10
  questions_down_days: 7

models:
  default: claude-opus-5-5
  fable: claude-fable-5-1
  fable_label: BAU-fable

identities:
  github_login: nakomis
  owner_plane_email: martin@nakomis.com
  worker_plane_email: bau@nakomis.com
  worker_github_login: "nakomis-bau[bot]"

github_app:
  app_id: 5319638
  installation_id: 171462254
  private_key:
    service: bau
    account: github-app-key

plane:
  url: https://plane.home.nakomis.com
  workspace: nakomis
  api_key:
    service: bau
    account: plane-api-key
  client_cert: ${BAU_HOME}/config/cere.crt.pem
  client_key: ${BAU_HOME}/config/cere.key.pem

claude:
  oauth_token:
    service: bau
    account: claude-oauth-token

paths:
  repos: ${BAU_HOME}/repos
  work: ${BAU_HOME}/work
  logs: ~/Library/Logs/BAU
  snapshot: ${BAU_HOME}/state/state.json
  pause_file: ${BAU_HOME}/state/paused
  # Last good copy of ATC's project list and priority, used when ATC is unreachable.
  atc_cache: ${BAU_HOME}/state/atc-cache.json
  lock: ${BAU_HOME}/state/run.lock

# ATC (nakomis/atc) supplies the BAU-enabled projects and the order work is done in.
# Reached through Leia's mTLS with the Plane client certificate above.
atc:
  url: https://atc.plane.home.nakomis.com

# container.image is derived from the build stamp unless host.yaml sets it.
container:
  network: bau-net
  proxy: http://bau-egress:8888
